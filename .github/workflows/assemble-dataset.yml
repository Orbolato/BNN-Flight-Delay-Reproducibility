name: Assemble exact reproduction dataset

on:
  push:
    branches: [main]
    paths:
      - 'data/.payload/READY'

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.head_commit.message == 'Trigger exact dataset assembly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify dataset
        shell: bash
        run: |
          set -euo pipefail
          cat data/.payload/part_*.b64 > /tmp/final_data_sbrf_sbgr.csv.gz.b64
          base64 --decode /tmp/final_data_sbrf_sbgr.csv.gz.b64 > data/final_data_sbrf_sbgr.csv.gz
          echo '17a3d479a517f8a57d3c7122824daefa488b17753da9c3538c10c9a92f1b78f4  data/final_data_sbrf_sbgr.csv.gz' | sha256sum -c -
          gzip -t data/final_data_sbrf_sbgr.csv.gz
      - name: Commit exact dataset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/.payload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          git commit -m 'Add exact SBRF-SBGR reproduction dataset'
          git push
